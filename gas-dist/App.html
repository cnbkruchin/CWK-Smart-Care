<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CWK Smart Care</title>
<style>/* CWK Smart Care — mobile-first, red/white/gray. #B91C1C is an example brand red (configurable),
   not a certified school identity color. Status is never conveyed by color alone (icon + text). */
:root {
  --brand: #B91C1C; --brand-dark: #7F1D1D; --brand-soft: #FEE2E2;
  --bg: #F5F5F5; --card: #FFFFFF; --text: #1F2937; --muted: #4B5563; --line: #D1D5DB;
  --ok: #166534; --ok-bg: #DCFCE7; --warn: #92400E; --warn-bg: #FEF3C7; --danger: #991B1B; --danger-bg: #FEE2E2; --info: #1E3A8A; --info-bg: #DBEAFE;
  --radius: 10px; --tap: 44px;
  font-family: "Sarabun", "Noto Sans Thai", "Leelawadee UI", "Tahoma", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-size: 16px; line-height: 1.55; }
a { color: var(--brand-dark); }
:focus-visible { outline: 3px solid #1D4ED8; outline-offset: 2px; }
.skip { position: absolute; left: -9999px; top: 0; }
.skip:focus { left: 8px; top: 8px; background: #fff; padding: 8px; z-index: 100; }
.boot { padding: 24px; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.row { display: flex; flex-wrap: wrap; align-items: center; }
.gap { gap: 8px; }

.layout { min-height: 100vh; display: flex; flex-direction: column; }
.topbar { background: var(--brand); color: #fff; padding: 8px 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.topbar .muted { color: #FECACA; }
.topbar .btn-link { color: #fff; }
.nav { background: #fff; border-bottom: 1px solid var(--line); overflow-x: auto; }
.nav ul { list-style: none; margin: 0; padding: 0 8px; display: flex; gap: 4px; }
.nav a { display: inline-flex; align-items: center; min-height: var(--tap); padding: 0 12px; text-decoration: none; color: var(--text); border-bottom: 3px solid transparent; white-space: nowrap; }
.nav a.active { border-bottom-color: var(--brand); font-weight: 700; }
main { padding: 12px; max-width: 1200px; width: 100%; margin: 0 auto; }
h1 { font-size: 1.4rem; margin: 8px 0 12px; }
h2 { font-size: 1.15rem; margin: 0 0 8px; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; margin: 12px 0; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.tile { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 96px; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); text-decoration: none; color: var(--text); text-align: center; padding: 8px; }
.tile-icon { font-size: 1.8rem; }

.btn { min-height: var(--tap); padding: 8px 16px; border-radius: 8px; border: 1px solid var(--line); background: #fff; color: var(--text); font: inherit; cursor: pointer; }
.btn-primary { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 700; }
.btn-primary:hover { background: var(--brand-dark); }
.btn-secondary { background: #fff; border-color: var(--brand); color: var(--brand-dark); }
.btn-danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn-link { background: none; border: none; color: var(--brand-dark); text-decoration: underline; padding: 8px; }
.btn-lg { min-height: 56px; font-size: 1.15rem; padding: 12px 24px; }
.btn[disabled] { opacity: .6; cursor: progress; }

.form { display: block; }
.form-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.field { margin: 8px 0; }
.field label { display: block; font-weight: 600; margin-bottom: 4px; }
.req { color: var(--danger); }
.input { width: 100%; min-height: var(--tap); padding: 8px 10px; border: 1px solid #9CA3AF; border-radius: 8px; font: inherit; background: #fff; color: var(--text); }
.input[aria-invalid="true"] { border-color: var(--danger); background: var(--danger-bg); }
.input.code { font-family: ui-monospace, monospace; letter-spacing: .1em; text-transform: uppercase; }
.hint { color: var(--muted); font-size: .875rem; }
.field-error { color: var(--danger); font-size: .9rem; min-height: 0; }
.field-error:not(:empty)::before { content: "✖ "; }
.check { display: inline-flex; align-items: center; gap: 6px; min-height: var(--tap); margin-right: 12px; }
fieldset { border: 1px solid var(--line); border-radius: 8px; }
.grid3 { display: grid; grid-template-columns: 1fr; gap: 0 12px; }
@media (min-width: 720px) { .grid3 { grid-template-columns: repeat(3, 1fr); } }

.state { padding: 12px; border-radius: 8px; margin: 8px 0; }
.state-loading { color: var(--muted); }
.state-empty { background: #fff; border: 1px dashed var(--line); color: var(--muted); }
.state-error { background: var(--danger-bg); color: var(--danger); }
.state-success { background: var(--ok-bg); color: var(--ok); }
.spinner { display: inline-block; width: 1em; height: 1em; border: 2px solid var(--line); border-top-color: var(--brand); border-radius: 50%; animation: spin 1s linear infinite; vertical-align: -2px; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
.alert { padding: 10px 12px; border-radius: 8px; margin: 8px 0; }
.alert-info { background: var(--info-bg); color: var(--info); }
.alert-warn { background: var(--warn-bg); color: var(--warn); }
.alert-danger { background: var(--danger-bg); color: var(--danger); }
.alert-ok { background: var(--ok-bg); color: var(--ok); }
.badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: .85rem; border: 1px solid transparent; }
.badge-ok { background: var(--ok-bg); color: var(--ok); }
.badge-warn { background: var(--warn-bg); color: var(--warn); }
.badge-danger { background: var(--danger-bg); color: var(--danger); }
.badge-neutral { background: #E5E7EB; color: var(--text); }
.badge-info { background: var(--info-bg); color: var(--info); }

.table-wrap { overflow-x: auto; }
.table { width: 100%; border-collapse: collapse; background: #fff; }
.table th, .table td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.table th { background: #F3F4F6; font-weight: 700; }
.table tr.clickable { cursor: pointer; }
.table tr.clickable:hover, .table tr.clickable:focus { background: var(--brand-soft); }
@media (max-width: 640px) {
  .table thead { display: none; }
  .table tr { display: block; border-bottom: 2px solid var(--line); }
  .table td { display: flex; gap: 8px; border: none; }
  .table td::before { content: attr(data-label); font-weight: 700; min-width: 40%; color: var(--muted); }
}
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; margin: 8px 0; }
.stat { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; text-align: center; }
.stat-n { font-size: 1.6rem; font-weight: 700; }
.stat-l { color: var(--muted); font-size: .9rem; }
.checklist { padding-left: 18px; }

.modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, .45); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 12px; }
.modal { background: #fff; border-radius: var(--radius); padding: 16px; max-width: 480px; width: 100%; }
.toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); padding: 10px 16px; border-radius: 8px; z-index: 60; }
.toast-ok { background: var(--ok); color: #fff; }
.toast-warn { background: var(--warn); color: #fff; }
.toast-danger { background: var(--danger); color: #fff; }

.login { display: flex; justify-content: center; padding: 16px; }
.login-card { background: #fff; border: 1px solid var(--line); border-top: 6px solid var(--brand); border-radius: var(--radius); padding: 16px; max-width: 460px; width: 100%; }

/* gate check-in */
.gate-input { font-size: 1.6rem; min-height: 64px; text-align: center; letter-spacing: .05em; }
.gate-card { display: grid; grid-template-columns: 96px 1fr; gap: 12px; align-items: center; }
.gate-photo { width: 96px; height: 120px; object-fit: cover; border-radius: 8px; background: #E5E7EB; display: flex; align-items: center; justify-content: center; color: var(--muted); }
.gate-result { font-size: 1.3rem; font-weight: 700; padding: 12px; border-radius: 8px; }
.timeline { list-style: none; padding: 0; }
.timeline li { border-left: 3px solid var(--line); padding: 4px 0 8px 12px; margin-left: 6px; }
.timeline li.kind-late { border-left-color: var(--warn); }
.timeline li.kind-leave { border-left-color: var(--info); }
.timeline li.kind-absent { border-left-color: var(--danger); }
.mark-group { display: flex; flex-wrap: wrap; gap: 4px; }
.mark-group label { border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-height: var(--tap); display: inline-flex; align-items: center; gap: 4px; }
@media print { .nav, .topbar, .form-actions, .btn { display: none !important; } main { max-width: none; } }
</style>
</head>

  function pollJob(app, jobId, box) {
    let stopped = false;
    const tick = async () => {
      if (stopped || !document.body.contains(box)) return;
      if (document.hidden) {
        setTimeout(tick, 5e3);
        return;
      }
      try {
        const j = await app.api.get("job.getStatus", { job_id: jobId }, { channel: `job-${jobId}` });
        const p = j.progress || {};
        mount(
          box,
          h("p", null, statusBadge(j.status === "SUCCEEDED" ? "OK" : j.status === "FAILED" ? "FAIL" : "WARN"), ` ${enumLabel("JobStatus", j.status)} ${p.message_th || ""}`),
          j.last_error ? alertBox("danger", j.last_error) : null
        );
        if (j.status === "SUCCEEDED" || j.status === "FAILED") {
          stopped = true;
          return;
        }
      } catch (e2) {
        if (e2.code !== "STALE_RESPONSE") mount(box, errorState(e2));
      }
      setTimeout(tick, 4e3 + Math.random() * 1500);
    };
    tick();
  }

        app.render();
      }, { variant: "link" }) : "" }
    ], jobs.items) : empty("ยังไม่มีงานเบื้องหลัง")));
    if (hlt.platform && hlt.platform.table_rows) {
      root.appendChild(section("ขนาดข้อมูล (แถว)", table([{ label: "ตาราง", key: "table" }, { label: "partition", key: "partition" }, { label: "แถว", key: "rows" }], hlt.platform.table_rows)));
    }
    return root;
  }

  // frontend/src/screens/extra.js
  var EXTRA_ROUTES = [];

  // frontend/src/screens/index.js
  var ROUTES = [
    { path: "home", title_th: "หน้าหลัก", icon: "🏠", render: renderHome },
    ...EXTRA_ROUTES.filter((r) => r.position === "top"),
    { path: "students", title_th: "รายชื่อนักเรียน", icon: "🎓", anyOf: ["student.search", "student.read"], render: renderStudents },
    ...EXTRA_ROUTES.filter((r) => r.position !== "top" && r.position !== "admin"),
    { path: "imports", title_th: "ศูนย์นำเข้าข้อมูล", icon: "📥", anyOf: ["import.manage"], render: renderImports },
    { path: "users", title_th: "ผู้ใช้และสิทธิ์", icon: "👥", anyOf: ["user.read"], render: renderUsers },
    { path: "settings", title_th: "ตั้งค่า", icon: "⚙", anyOf: ["settings.business", "system.health"], render: renderSettings },
    ...EXTRA_ROUTES.filter((r) => r.position === "admin"),
    { path: "health", title_th: "สถานะระบบ", icon: "🩺", anyOf: ["system.health"], render: renderHealth }
  ];

  // frontend/src/screens/login.js
  function renderLogin(app, root, onReady) {
    const pc = app.publicConfig || {};
    const school = pc.school && pc.school.name_th || "โรงเรียน";
    const notice = h(
      "p",
      { class: "muted small" },
      "ระบบนี้ใช้ข้อมูลการมาเรียน การลา และการติดต่อผู้ปกครองเพื่อดูแลช่วยเหลือนักเรียนตามหน้าที่ของโรงเรียน ",
      "การเข้าถึงข้อมูลจำกัดตามบทบาทที่โรงเรียนอนุมัติ (ประกาศความเป็นส่วนตัวฉบับเต็มอยู่ระหว่างโรงเรียนพิจารณา)"
    );
    const card = h("div", { class: "login-card" }, h("h1", null, "CWK Smart Care"), h("p", { class: "muted" }, `${school} · ระบบแจ้งลา ลงเวลาสาย และดูแลช่วยเหลือนักเรียน`));
    if (pc.env && pc.env !== "PROD") card.appendChild(alertBox("warn", `สภาพแวดล้อม ${pc.env}: ใช้ข้อมูลทดสอบเท่านั้น`));
    if (pc.setup_required) card.appendChild(alertBox("danger", "ระบบยังติดตั้งไม่ครบ ผู้ดูแลต้องรัน adminSetup จาก Apps Script Editor"));
    if (pc.auth_mode === "DEMO") {
      const userId = input("user_id", { autocomplete: "off", placeholder: "UUID ของผู้ใช้ทดสอบ" });
      const pass = input("passphrase", { type: "password", autocomplete: "off" });
      card.appendChild(form(
        [field("รหัสผู้ใช้ทดสอบ (DEMO)", userId, { required: true, hint: "ดูรายการจากผลรัน adminSeedDemo ใน Apps Script Editor" }), field("รหัสผ่านทดสอบของสภาพแวดล้อม", pass, { required: true })],
        async () => {
          app.auth.signInDemo(userId.value.trim(), pass.value);
          try {
            await onReady();
          } catch (e2) {
            await app.auth.signOut();
            throw e2;
          }
          return false;
        },
        { submitLabel: "เข้าสู่ระบบ (ทดสอบ)", large: true }
      ));
      card.appendChild(notice);
      mount(root, h("div", { class: "login" }, card));
      return;
    }
    const auth = app.auth;
    const body = h("div");
    card.appendChild(body);
    card.appendChild(notice);
    mount(root, h("div", { class: "login" }, card));
    const showSignIn = () => {
      const email = input("email", { type: "email", autocomplete: "username", inputmode: "email" });
      const pw = input("password", { type: "password", autocomplete: "current-password" });
      mount(
        body,
        form([field("อีเมล", email, { required: true }), field("รหัสผ่าน", pw, { required: true })], async () => {
          try {
            await auth.signIn(email.value.trim(), pw.value);
          } catch (e2) {
            throw { message_th: firebaseErrorTh(e2) };
          }
          await afterSignIn();
          return false;
        }, { submitLabel: "เข้าสู่ระบบ", large: true }),
        h(
          "div",
          { class: "row gap" },
          h("button", { type: "button", class: "btn btn-link", onclick: showSignUp }, "สร้างบัญชีใหม่"),
          h("button", { type: "button", class: "btn btn-link", onclick: showReset }, "ลืมรหัสผ่าน")
        )
      );
      email.focus();
    };
    const showSignUp = () => {
      const email = input("email", { type: "email", autocomplete: "username" });
      const pw = input("password", { type: "password", autocomplete: "new-password", minlength: 8 });
      mount(
        body,
        alertBox("info", "การสร้างบัญชียังไม่ให้สิทธิ์ดูข้อมูลนักเรียน ต้องใช้รหัสคำเชิญจากโรงเรียนหลังยืนยันอีเมล"),
        form([field("อีเมล", email, { required: true }), field("ตั้งรหัสผ่าน (อย่างน้อย 8 ตัวอักษร)", pw, { required: true })], async () => {
          if (pw.value.length < 8) throw { message_th: "รหัสผ่านต้องมีอย่างน้อย 8 ตัวอักษร", field_errors: [{ field: "password", message_th: "อย่างน้อย 8 ตัวอักษร" }] };
          try {
            await auth.signUp(email.value.trim(), pw.value);
          } catch (e2) {
            throw { message_th: firebaseErrorTh(e2) };
          }
          await afterSignIn();
          return false;
        }, { submitLabel: "สร้างบัญชี", large: true }),
        h("button", { type: "button", class: "btn btn-link", onclick: showSignIn }, "กลับไปเข้าสู่ระบบ")
      );
    };
    const showReset = () => {
      const email = input("email", { type: "email", autocomplete: "username" });
      mount(
        body,
        form([field("อีเมลที่ใช้สมัคร", email, { required: true })], async () => {
          try {
            await auth.resetPassword(email.value.trim());
          } catch (_) {
          }
          return "หากอีเมลนี้มีบัญชี ระบบได้ส่งลิงก์ตั้งรหัสผ่านใหม่แล้ว";
        }, { submitLabel: "ส่งลิงก์ตั้งรหัสผ่านใหม่" }),
        h("button", { type: "button", class: "btn btn-link", onclick: showSignIn }, "กลับไปเข้าสู่ระบบ")
      );
    };
    const showVerify = () => {
      mount(
        body,
        alertBox("warn", `กรุณายืนยันอีเมล ${auth.email || ""} จากลิงก์ที่ระบบส่งไป แล้วกดปุ่ม "ยืนยันแล้ว"`),
        h(
          "div",
          { class: "row gap" },
          actionButton("ยืนยันแล้ว", async () => {
            await auth.refresh();
            await afterSignIn();
          }),
          actionButton("ส่งอีเมลยืนยันอีกครั้ง", async () => {
            await auth.sendVerification();
            toast("ส่งอีเมลแล้ว");
          }, { variant: "secondary" }),
          actionButton("ออกจากระบบ", async () => {
            await auth.signOut();
            showSignIn();
          }, { variant: "link" })
        )
      );
    };
    const showRedeem = () => {
      const code = input("code", { autocomplete: "one-time-code", placeholder: "XXXX-XXXX-XXXX-XXXX-XXXX", class: "input code" });
      mount(
        body,
        section(
          "เปิดใช้งานบัญชี",
          h("p", null, "กรอกรหัสคำเชิญที่ได้รับจากโรงเรียน (ใช้ได้ครั้งเดียวและมีวันหมดอายุ)"),
          form([field("รหัสคำเชิญ", code, { required: true })], async () => {
            await app.api.mutate("auth.redeemInvitation", { code: code.value.trim() });
            await onReady();
            return false;
          }, { submitLabel: "เปิดใช้งาน", large: true })
        ),
        actionButton("ออกจากระบบ", async () => {
          await auth.signOut();
          showSignIn();
        }, { variant: "link" })
      );
      code.focus();
    };
    const afterSignIn = async () => {
      if (!auth.signedIn) return showSignIn();
      if (!auth.emailVerified) return showVerify();
      const s = await app.loadSession();
      if (!s.linked) return showRedeem();
      await onReady();
    };
    if (auth.signedIn) afterSignIn().catch(() => showSignIn());
    else showSignIn();
  }

  // frontend/src/main.js
  function deviceId() {
    try {
      let id = sessionStorage.getItem("cwk.device");
      if (!id) {
        id = uuid();
        sessionStorage.setItem("cwk.device", id);
      }
      return id;
    } catch (_) {
      return null;
    }
  }
  async function start(options = {}) {
    const root = document.getElementById("app");
    const boot = window.__CWK_BOOT__ || {};
    const onGas = !!(globalThis.google && google.script && google.script.run);
    const transport = options.transport || (onGas ? new GasRpcTransport() : new HttpTransport(options.apiBase || ""));
    let publicConfig = boot.public_config;
    let auth;
    const api = new ApiClient({ transport, getCredential: () => auth ? auth.credential() : null, deviceId: deviceId(), onUnauthenticated: () => showLogin() });
    if (!publicConfig) {
      try {
        publicConfig = await api.get("app.publicConfig", {});
      } catch (e2) {
        mount(root, errorState(e2, () => location.reload()));
        return;
      }
    }
    auth = publicConfig.auth_mode === "GATEWAY" && publicConfig.firebase ? new FirebaseAuth(publicConfig.firebase, publicConfig.auth_persistence) : new DemoAuth();
    try {
      await auth.init();
    } catch (e2) {
      mount(root, errorState({ message_th: `โหลดระบบยืนยันตัวตนไม่สำเร็จ: ${e2.message}` }, () => location.reload()));
      return;
    }
    const app = new App({ root, api, auth, publicConfig, routes: ROUTES, boot });
    app.onLoggedOut = () => showLogin();
    globalThis.__cwkApp = app;
    async function ready() {
      const s = await app.loadSession();
      if (!s.linked) {
        showLogin();
        return;
      }
      if (boot.initial_route && !location.hash) location.hash = `#/${boot.initial_route}${boot.focus_id ? `?id=${boot.focus_id}` : ""}`;
      await app.render();
    }
    function showLogin() {
      app.session = null;
      renderLogin(app, root, ready);
    }
    if (auth.signedIn) {
      try {
        await ready();
      } catch (_) {
        showLogin();
      }
    } else showLogin();
  }
  if (typeof window !== "undefined" && !window.__CWK_NO_AUTOSTART__) {
    window.addEventListener("DOMContentLoaded", () => start());
    if (document.readyState !== "loading") start();
  }
  return __toCommonJS(main_exports);
})();
</script>
